limit_req_zone $binary_remote_addr zone=skyvision_uploads:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name classroom.skyvisionairline.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name classroom.skyvisionairline.net;

    # Managed by Certbot after: certbot --nginx -d classroom.skyvisionairline.net
    ssl_certificate /etc/letsencrypt/live/classroom.skyvisionairline.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classroom.skyvisionairline.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 2m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/files {
        client_max_body_size 300k;
        limit_req zone=skyvision_uploads burst=40 nodelay;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}